name: Deploy Azure Function App

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        runs-on: windows-latest

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            # ============================================================
            # PowerShell static analysis
            # ============================================================
            - name: Install PSScriptAnalyzer
              shell: pwsh
              run: |
                  Install-Module PSScriptAnalyzer `
                      -Scope CurrentUser `
                      -Force `
                      -AllowClobber

            - name: Run PSScriptAnalyzer
              shell: pwsh
              run: |
                  $results = Invoke-ScriptAnalyzer `
                      -Path . `
                      -Recurse `
                      -Severity Error,Warning

                  if ($results) {
                      $results | Format-Table -AutoSize
                      Write-Error "PSScriptAnalyzer found PowerShell issues."
                      exit 1
                  }

                  Write-Host "PSScriptAnalyzer passed successfully."

            # ============================================================
            # Azure authentication
            # ============================================================
            - name: Login to Azure
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            # ============================================================
            # Azure diagnostics
            # ============================================================
            - name: Capture Azure resources
              shell: pwsh
              run: |
                  az account show -o json > azure-account.json
                  az group list -o json > azure-resource-groups.json
                  az resource list -o json > azure-resources.json
                  az functionapp list -o json > azure-function-apps.json

            - name: Upload Azure diagnostics
              uses: actions/upload-artifact@v4
              with:
                  name: azure-diagnostics
                  path: |
                      azure-account.json
                      azure-resource-groups.json
                      azure-resources.json
                      azure-function-apps.json

            # ============================================================
            # Deployment
            # ============================================================
            - name: Deploy Function App
              uses: Azure/functions-action@v1
              with:
                  app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
                  package: .
                  respect-funcignore: true

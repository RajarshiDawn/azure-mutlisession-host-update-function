name: Deploy Azure Function App

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        runs-on: windows-latest

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Login to Azure
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Capture Azure resources
              shell: pwsh
              run: |
                  az account show -o json > azure-account.json
                  az group list -o json > azure-resource-groups.json
                  az resource list -o json > azure-resources.json
                  az functionapp list -o json > azure-function-apps.json

            - name: Upload Azure diagnostics
              uses: actions/upload-artifact@v4
              with:
                  name: azure-diagnostics
                  path: |
                      azure-account.json
                      azure-resource-groups.json
                      azure-resources.json
                      azure-function-apps.json

            - name: Deploy Function App
              uses: Azure/functions-action@v1
              with:
                  app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
                  package: .
                  respect-funcignore: true
